<div class="modal-style">	
	<div class="modal-header clearfix">
		<h4 ng-if="accion == 'crear'" class="modal-title">Nueva empresa</h4>
		<h4 ng-if="accion == 'editar'" class="modal-title">Editar empresa</h4>
		<h4 ng-if="accion == 'eliminar'" class="modal-title">Eliminar empresa</h4>
		<span class="close ion ion-android-close" ng-click="modalClose()"></span>
	</div>
	<div class="modal-body">
		<form class="form-horizontal" name="modal-demo-form" ng-if="accion == 'crear' || accion == 'editar'" action="javascript:;" novalidate>
			<div class="row form-group">
				<div class="col-sm-12">
					<label>Empresa</label>
					<input type="text" class="form-control" ng-model="empresa.nombre" required>
				</div>
			</div>
		</form>
		<div class="row form-group" ng-if="accion == 'eliminar'">
			<h3>¿Realmente desea eliminar este empresa?</h3>
		</div>
		<div class="row form-group">
			<div class="col-sm-12 text-right">
				<button class="btn btn-success" ng-if="accion == 'crear'" ng-disabled="form.$invalid" ng-click="saveData(empresa)">Registrar</button>
				<button class="btn btn-success" ng-if="accion == 'editar'" ng-disabled="form.$invalid" ng-click="saveData(empresa)">Actualizar</button>
				<button class="btn btn-danger" ng-if="accion == 'eliminar'" ng-click="saveData(empresa)">Confirmar</button>
			</div>
		</div>
	</div>
</div>
